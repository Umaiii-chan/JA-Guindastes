# =============================================================================
# CI — verificações determinísticas + deploy por ambiente.
#
# Nenhum passo chama IA. As verificações não precisam de segredo nenhum; só o
# job de deploy usa credenciais, e elas vêm do GitHub Environment da branch.
#
# Os comandos de verificação devem ser EXATAMENTE os mesmos listados em
# docs/development-guide.md § 3. Se mudar aqui, mude lá (e vice-versa).
#
# Modelo de branches (ADR-002): development → homologation → production.
# Cada branch faz deploy do ambiente de mesmo nome.
#
# Como adaptar:
#   1. O job `structure` já funciona em qualquer projeto — não precisa mexer.
#   2. No job `quality`, descomente e ajuste o bloco da sua stack e apague os
#      demais. Cada bloco tem: setup + cache, instalação, lint, formatação,
#      tipos, testes, build, auditoria.
#   3. No job `deploy`, descomente o bloco da sua forma de publicar e crie os
#      Environments no GitHub (Settings → Environments): development,
#      homologation e production. Ver docs/guides/git-github.md § 8.3.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [development, homologation, production]
  workflow_dispatch:

# Menor privilégio no nível do workflow: só leitura do repositório.
# O job de deploy amplia o que precisar, localmente.
permissions:
  contents: read

# Cancela execuções antigas do mesmo PR/branch para economizar minutos.
# Deploys em production NÃO são cancelados no meio (ver o job deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Valida a estrutura do workflow de IAs (arquivos obrigatórios, handoff,
  # tarefas, marcadores <preencher>, .env, co-autoria de IA em commits,
  # links quebrados). Universal — funciona em qualquer stack.
  # ---------------------------------------------------------------------------
  structure:
    name: Estrutura do workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # histórico necessário para comparar os commits da branch com development
          fetch-depth: 0
      - name: check-structure.sh
        run: bash scripts/check-structure.sh
        # Quando o projeto amadurecer, torne avisos em erros:
        # env:
        #   STRICT: "1"

  # ---------------------------------------------------------------------------
  # Backend (Python 3.14 + uv) — ADR-012. Mesmos comandos de
  # docs/development-guide.md § 3.
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint, tipos, camadas, testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: structure
    defaults:
      run:
        working-directory: backend
    # PostgreSQL descartável, só para os testes de integração e para o Alembic (TASK-018).
    # As credenciais abaixo valem só para este container efêmero do CI: não são segredo.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: crane_ci
          POSTGRES_PASSWORD: ci_only_not_a_secret
          POSTGRES_DB: crane_simulator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crane_ci -d crane_simulator_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://crane_ci:ci_only_not_a_secret@localhost:5432/crane_simulator_ci
      # Faz os testes de integração falharem (e não pularem) se o banco não responder.
      REQUIRE_INTEGRATION_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Formatação
        run: uv run ruff format --check .
      - name: Tipos
        run: uv run mypy app
      - name: Camadas da Clean Architecture
        run: uv run lint-imports
      - name: Migrations (Alembic)
        run: uv run alembic upgrade head
      - name: Testes (inclui integração com PostgreSQL)
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # Qualidade do código. Descomente o bloco da sua stack.
  # ---------------------------------------------------------------------------
  quality:
    name: Frontend (lint, formatação, tipos, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: structure
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Frontend (Node 24 + npm + Vite) — ADR-012. Mesmos comandos de docs/development-guide.md § 3.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Tipos
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

      # ======================= NODE.JS / TYPESCRIPT ============================
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version: "22"
      #     cache: npm                      # ou pnpm / yarn
      # - run: npm ci
      # - name: Lint
      #   run: npm run lint
      # - name: Formatação
      #   run: npm run format:check         # ex.: prettier --check .
      # - name: Tipos
      #   run: npm run typecheck            # ex.: tsc --noEmit
      # - name: Testes
      #   run: npm test -- --coverage
      # - name: Build
      #   run: npm run build
      # - name: Auditoria de dependências
      #   run: npm audit --audit-level=high
      # =========================================================================

      # ======================= PYTHON (uv) =====================================
      # - uses: astral-sh/setup-uv@v6
      #   with:
      #     enable-cache: true
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version-file: "pyproject.toml"   # ou python-version: "3.12"
      # - run: uv sync --all-extras --dev
      # - name: Lint
      #   run: uv run ruff check .
      # - name: Formatação

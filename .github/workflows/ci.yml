#     env:
#       DATABASE_URL: ${{ secrets[format('{0}_DATABASE_URL', steps.env.outputs.prefix)] }}
#     run: ...
#
# Nesse caminho você perde a aprovação humana antes do deploy. Se produção
# precisar de aprovação, prefira um workflow separado com workflow_dispatch.

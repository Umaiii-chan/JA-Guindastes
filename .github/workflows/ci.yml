  # ---------------------------------------------------------------------------
  # Imagens Docker da stack (TASK-027): valida o docker-compose.yml, constrói as
  # imagens do backend e do frontend (sem push) e sobe a stack para um teste de
  # fumaça. As credenciais do .env abaixo valem só para os containers efêmeros
  # deste job: não são segredo.
  # ---------------------------------------------------------------------------
  docker:
    name: Imagens Docker (build e teste de fumaça)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: structure
    steps:
      - uses: actions/checkout@v4
      - name: Gerar .env de CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=crane_ci
          POSTGRES_PASSWORD=ci_only_not_a_secret
          POSTGRES_DB=crane_simulator_ci
          EOF
      - name: Validar docker-compose.yml
        run: docker compose config --quiet
      - name: Build da imagem do backend
        run: docker build --tag ja-guindastes-backend:local backend
      - name: Build da imagem do frontend
        run: docker build --tag ja-guindastes-frontend:local frontend
      - name: Subir a stack (espera os healthchecks)
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Migrations dentro do container (Alembic)
        run: docker compose run --rm --no-deps backend alembic upgrade head
      - name: Teste de fumaça
        run: |
          set -euo pipefail
          # backend direto
          curl -fsS http://127.0.0.1:8000/openapi.json > /dev/null
          # frontend estático (index.html do build do Vite)
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          # proxy /api/ do nginx até o backend: POST sem arquivo → 422 do FastAPI
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/api/v1/load-charts/validate)
          test "$code" = "422" || { echo "esperado 422 pelo proxy, recebido $code"; exit 1; }
      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes

  # ---------------------------------------------------------------------------
  # Testes ponta a ponta (TASK-036): sobe a stack como o job "Imagens Docker" e
  # roda o Playwright (Chromium) contra o frontend servido pelo nginx, com o
  # backend atrás de /api. O teste do fluxo com dados semeados só roda quando
  # E2E_SEED_CONFIGURATION_ID estiver definida (seed da TASK-035); sem ela, é
  # pulado. As credenciais do .env valem só para os containers efêmeros deste
  # job: não são segredo.
  # ---------------------------------------------------------------------------
  e2e:
    name: E2E (Playwright contra a stack Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: structure
    steps:
      - uses: actions/checkout@v4
      - name: Gerar .env de CI
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=crane_ci
          POSTGRES_PASSWORD=ci_only_not_a_secret
          POSTGRES_DB=crane_simulator_ci
          EOF
      - name: Build das imagens
        run: |
          docker build --tag ja-guindastes-backend:local backend
          docker build --tag ja-guindastes-frontend:local frontend
      - name: Subir a stack (espera os healthchecks)
        run: docker compose up --detach --no-build --wait --wait-timeout 180
      - name: Migrations dentro do container (Alembic)
        run: docker compose run --rm --no-deps backend alembic upgrade head
      - name: Dados de demonstração FICTÍCIOS (seed da TASK-035)
        run: docker compose run --rm --no-deps backend python -m app.demo_seed
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci
      - name: Instalar o Chromium do Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Testes ponta a ponta
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_BACKEND: "1"
          E2E_SEED_MANUFACTURER_ID: demo-ficticio-fabricante
          E2E_SEED_CRANE_ID: demo-ficticio-guindaste
          E2E_SEED_CONFIGURATION_ID: demo-ficticio-configuracao
        run: npm run e2e
      - name: Relatório do Playwright (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Relatório HTML e traces (ver frontend/e2e/playwright.config.ts).
          path: frontend/node_modules/.tmp/e2e/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose logs --no-color
      - name: Derrubar a stack
        if: always()
        run: docker compose down --volumes

  # ---------------------------------------------------------------------------
  # Deploy do ambiente correspondente à branch.
  #
  # Só roda em `push` numa das três branches longas — nunca em PR, nunca em
  # branch de tarefa — e só depois de `structure` e `quality` passarem.
  #
  # `environment.name` usa o nome da branch, então:
  #   push em development  → Environment "development"
  #   push em homologation → Environment "homologation"
  #   push em production   → Environment "production"
  #
  # Os secrets vêm do Environment: use o MESMO nome de variável nos três
  # (ex.: DATABASE_URL) com valores diferentes, e o workflow não precisa saber
  # em qual ambiente está.
  #
  # Para exigir aprovação humana antes de subir para produção, configure
  # "Required reviewers" no Environment `production` (Settings → Environments).
  # Nada muda aqui: o job fica pendente até alguém aprovar.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [structure, backend, quality]
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name }}
      # url: https://${{ github.ref_name }}.exemplo.com.br   # aparece no GitHub após o deploy
    permissions:
      contents: read
      # id-token: write        # descomente se usar OIDC (AWS, GCP, Azure) em vez de secret estático
    steps:
      - uses: actions/checkout@v4

      # ======================= PLACEHOLDER (apague ao adaptar) =================
      - name: Deploy ainda não configurado
        run: |
          echo "::warning::Deploy não configurado para o ambiente '${{ github.ref_name }}'."
          echo "Descomente um bloco em .github/workflows/ci.yml (job deploy) e crie o"
          echo "GitHub Environment correspondente. Ver docs/guides/git-github.md § 8.3."
      # =========================================================================

      # ======================= EXEMPLO: container + registry ===================
      # - name: Login no registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ${{ secrets.REGISTRY_HOST }}
      #     username: ${{ secrets.REGISTRY_USER }}
      #     password: ${{ secrets.REGISTRY_TOKEN }}
      # - name: Build e push da imagem
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: ${{ secrets.REGISTRY_HOST }}/meu-app:${{ github.ref_name }}-${{ github.sha }}
      # - name: Aplicar no ambiente
      #   run: ./scripts/deploy.sh "${{ github.ref_name }}" "${{ github.sha }}"

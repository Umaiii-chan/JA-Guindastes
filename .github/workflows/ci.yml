  # ---------------------------------------------------------------------------
  # Deploy do ambiente correspondente à branch.
  #
  # Só roda em `push` numa das três branches longas — nunca em PR, nunca em
  # branch de tarefa — e só depois de `structure` e `quality` passarem.
  #
  # `environment.name` usa o nome da branch, então:
  #   push em development  → Environment "development"
  #   push em homologation → Environment "homologation"
  #   push em production   → Environment "production"
  #
  # Os secrets vêm do Environment: use o MESMO nome de variável nos três
  # (ex.: DATABASE_URL) com valores diferentes, e o workflow não precisa saber
  # em qual ambiente está.
  #
  # Para exigir aprovação humana antes de subir para produção, configure
  # "Required reviewers" no Environment `production` (Settings → Environments).
  # Nada muda aqui: o job fica pendente até alguém aprovar.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [structure, backend, quality]
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name }}
      # url: https://${{ github.ref_name }}.exemplo.com.br   # aparece no GitHub após o deploy
    permissions:
      contents: read
      # id-token: write        # descomente se usar OIDC (AWS, GCP, Azure) em vez de secret estático
    steps:
      - uses: actions/checkout@v4

      # ======================= PLACEHOLDER (apague ao adaptar) =================
      - name: Deploy ainda não configurado
        run: |
          echo "::warning::Deploy não configurado para o ambiente '${{ github.ref_name }}'."
          echo "Descomente um bloco em .github/workflows/ci.yml (job deploy) e crie o"
          echo "GitHub Environment correspondente. Ver docs/guides/git-github.md § 8.3."

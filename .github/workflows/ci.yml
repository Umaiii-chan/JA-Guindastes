      #     DATABASE_URL: ${{ secrets.DATABASE_URL }}   # valor do Environment da branch
      #   run: <comando de migration de docs/development-guide.md § 3>
      # =========================================================================

# -----------------------------------------------------------------------------
# SE ENVIRONMENTS NÃO ESTIVEREM DISPONÍVEIS (repositório privado no plano
# gratuito), remova o bloco `environment:` do job deploy e use repository
# secrets com prefixo por ambiente. Exemplo:

#         development)  echo "prefix=DEV"  >> "$GITHUB_OUTPUT" ;;
#         homologation) echo "prefix=HOM"  >> "$GITHUB_OUTPUT" ;;
#         production)   echo "prefix=PROD" >> "$GITHUB_OUTPUT" ;;
#       esac

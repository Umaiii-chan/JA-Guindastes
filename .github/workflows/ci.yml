      #   env:
      #     DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      #     APP_ENV: ${{ github.ref_name }}
      #   run: |
      #     npx --yes <cli-da-plataforma> deploy --env "$APP_ENV" --token "$DEPLOY_TOKEN"
      # =========================================================================

      # ======================= EXEMPLO: migrations antes do deploy =============
      # - name: Aplicar migrations

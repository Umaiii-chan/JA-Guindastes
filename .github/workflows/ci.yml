# -----------------------------------------------------------------------------
# NÃO adicione aqui nenhum passo que chame ChatGPT, Claude, Gemini ou outra IA.
# Isso exigiria chaves de API (custo) e contraria ADR-001. Se um dia for feito,
# deve ser um workflow separado, manual (workflow_dispatch), com ambiente
# protegido e aprovação humana.
# -----------------------------------------------------------------------------

[project]
name = "ai-dev-orchestrator"
version = "0.1.0"
description = "Auditable multi-model software-development workflow"
requires-python = ">=3.12"
dependencies = [
  "langgraph>=1.0,<2",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-anthropic>=1.0,<2",
  "langchain-google-genai>=3.0,<5",
  "pydantic-settings>=2.7,<3",
  "pyyaml>=6,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "types-pyyaml>=6,<7",
]

[project.scripts]
ai-flow = "ai_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true

# Ambiente local com a stack completa (doc-fonte § 22.1; ADR-007; TASK-011 e TASK-027):
# postgres + backend (FastAPI) + frontend (nginx servindo o build do Vite e encaminhando /api/).
#
#   docker compose up -d --build            # constrói as imagens e sobe tudo
#   docker compose ps                       # estado; pronto quando os três estiverem "healthy"
#   docker compose run --rm backend alembic upgrade head   # aplica as migrations (sob demanda)
#   docker compose run --rm backend sh -c "alembic upgrade head && python -m app.demo_seed"
#                                           # migra e semeia a demonstração FICTÍCIA (TASK-035; docs/demo.md)
#   docker compose run --rm backend python -m app.create_admin --username admin
#                                           # cria o primeiro admin; pede a senha (TASK-038; docs/demo.md)
#   docker compose up -d postgres           # só o banco, para rodar backend/frontend direto (uv e npm)
#
# As variáveis vêm do .env da raiz (copiado de .env.example; ignorado pelo Git). Nenhum valor real
# fica neste arquivo. As variáveis POSTGRES_* só valem na PRIMEIRA subida, quando o volume é criado.
# Todas as portas são publicadas só em 127.0.0.1: nada fica exposto na rede.

# Nome fixo: o volume fica "ja-guindastes_postgres-data" em qualquer pasta ou worktree do projeto.
name: ja-guindastes

services:
  postgres:
    # Tag major fixada (PostgreSQL 18). Trocar de major exige migrar os dados do volume.
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER no .env (ver .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB no .env (ver .env.example)}
    ports:
      # Só na interface local da máquina: o banco não fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # A partir do PostgreSQL 18, a imagem oficial guarda os dados em /var/lib/postgresql/18/docker;
      # o volume é montado no diretório pai, como a imagem espera.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ja-guindastes-backend:local
    environment:
      # Dentro da rede do Compose o banco é o host "postgres", porta 5432 (não o localhost do .env).
      # Por padrão a URL é montada com os POSTGRES_*; se a senha tiver caracteres especiais de URL
      # (@, :, /, #...), defina BACKEND_DATABASE_URL no .env com a senha já codificada.
      DATABASE_URL: ${BACKEND_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
      # Arquivo-fonte das tabelas de carga importadas (TASK-031), no volume nomeado abaixo (TASK-035).
      # Caminho fixo dentro do container, criado na imagem com o dono do processo (backend/Dockerfile);
      # o FILE_STORAGE_DIR do .env vale só para o backend rodando fora do container.
      FILE_STORAGE_DIR: /data/load-charts
      # Flag Secure do cookie de sessão (TASK-038; ADR-016 § 3). Padrão true; false só para usar a
      # stack em HTTP local (http://127.0.0.1:8080), nunca em produção. Vem do .env.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Assistente de IA (TASK-076; ADR-039). Vêm do .env; sem GEMINI_API_KEY a IA fica desligada.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_FALLBACK_MODELS: ${OPENAI_FALLBACK_MODELS:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-}
    volumes:
      - load-chart-files:/data/load-charts
    ports:
      # API e OpenAPI (/docs) acessíveis direto no host, só na interface local.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Rota de saúde da TASK-029 (mesmo teste do HEALTHCHECK da imagem). Responde 200 enquanto o
      # processo atende, mesmo com o banco DOWN (pendência 1 do handoff da TASK-029).
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
    image: ja-guindastes-frontend:local
    environment:
      # Destino do proxy reverso de /api/ no nginx (frontend/nginx.conf.template).
      API_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5

volumes:
  postgres-data:
  # Arquivos-fonte das tabelas importadas (TASK-035); "ja-guindastes_load-chart-files".
  # `docker compose down --volumes` apaga este e o do banco (recomeça a demonstração do zero).
  load-chart-files:
